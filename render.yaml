services:
  # Backend API Service
  - type: web
    name: milquu-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Comma-separated list of allowed browser origins. The real frontend is
      # the Vercel deployment (project "milquufresh"), not the Render static
      # site below — add a custom domain here too if you attach one in Vercel.
      - key: CORS_ORIGIN
        value: https://milquufresh.vercel.app
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # Nightly subscription run.
  #
  # This is the authoritative scheduler. The web service also schedules the run
  # in-process as a safety net, but a single web instance sleeps and restarts on
  # deploy, and a missed night means no milk. Both are safe to run: the engine
  # guards on (subscription, deliveryDate), so the second one to arrive is a
  # no-op rather than a second charge.
  #
  # 16:00 UTC = 21:30 IST — after the 21:00 IST cut-off that closes changes to
  # tomorrow's crate, so the order is built from the plan the customer settled on.
  - type: cron
    name: milquu-subscription-engine
    env: node
    schedule: "0 16 * * *"
    buildCommand: cd backend && npm install
    startCommand: cd backend && node cron/subscriptionEngine.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # Frontend Static Site
  #
  # Not the live frontend — production traffic is served from Vercel (project
  # "milquufresh"), which is what CORS_ORIGIN above is set for. This definition
  # is kept in case Render is ever used instead of Vercel; update VITE_API_URL
  # and redeploy this service before relying on it.
  - type: web
    name: milquu-frontend
    env: static
    buildCommand: cd frontend-react && npm install && npm run build
    staticPublishPath: frontend-react/dist
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://milquu-backend.onrender.com
    routes:
      # Redirect all 404s to index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html
